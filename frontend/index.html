<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Bigas — Virtual HQ for Solo Founders</title>
    <meta
      name="description"
      content="Bigas is an open-source virtual AI team for solo founders. Chat, board, and objectives across marketing, product, engineering, and finance."
    />
    <link rel="canonical" href="https://bigas.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bigas.me/" />
    <meta property="og:site_name" content="Bigas" />
    <meta property="og:title" content="Bigas — Virtual HQ for Solo Founders" />
    <meta
      property="og:description"
      content="Open-source virtual HQ: chat with AI specialists, ship on a Kanban board, and track quarterly objectives. Fork and run locally in about five minutes."
    />
    <meta property="og:image" content="https://bigas.me/bigas-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@bigasmyaiteam" />
    <meta name="twitter:title" content="Bigas — Virtual HQ for Solo Founders" />
    <meta
      name="twitter:description"
      content="Open-source virtual HQ: chat with AI specialists, ship on a Kanban board, and track quarterly objectives. Fork and run locally in about five minutes."
    />
    <meta name="twitter:image" content="https://bigas.me/bigas-logo.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Bigas",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Docker",
        "description": "Open-source virtual HQ for solo founders: chat with AI specialists, Kanban board, and quarterly objectives.",
        "url": "https://bigas.me/",
        "downloadUrl": "https://github.com/mckort/bigas",
        "codeRepository": "https://github.com/mckort/bigas",
        "license": "https://github.com/mckort/bigas/blob/main/LICENSE",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('bigas-theme')
          const theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (_) {}
      })()
    </script>
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
