# Run Bigas automated MCP QA on pull request updates.
# Configure in Settings → Secrets and variables → Actions:
#   - Variable: BIGAS_URL = your Bigas Cloud Run URL (required)
#   - Secret:   BIGAS_API_KEY = one of your Bigas access keys
#   - Variable: BIGAS_QA_ENABLED = true  (required to run this workflow)
#   - Variable: BIGAS_QA_MCP_URL = MCP server URL to test (defaults to BIGAS_URL)
# Optional:
#   - Secret: BIGAS_QA_MCP_TOKEN = access key for the target MCP server (if different)
name: Bigas MCP QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  qa:
    if: vars.BIGAS_QA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require BIGAS_URL
        run: |
          if [ -z "$BIGAS_URL" ]; then
            echo "::error::BIGAS_URL is not set."
            exit 1
          fi
        env:
          BIGAS_URL: ${{ vars.BIGAS_URL }}

      - name: Get PR diff via GitHub API
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_BIGAS || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o diff.txt \
            -H "Accept: application/vnd.github.diff" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to fetch PR diff (HTTP $HTTP_CODE)"
            cat diff.txt || true
            exit 1
          fi
          echo "Fetched PR diff bytes=$(wc -c < diff.txt | tr -d ' ')"

      - name: Trigger Bigas MCP QA
        id: bigas
        env:
          BIGAS_URL: ${{ vars.BIGAS_URL }}
          BIGAS_API_KEY: ${{ secrets.BIGAS_API_KEY }}
          MCP_URL: ${{ vars.BIGAS_QA_MCP_URL }}
          MCP_TOKEN: ${{ secrets.BIGAS_QA_MCP_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 -c "
          import json, os
          with open('diff.txt', encoding='utf-8', errors='replace') as f:
              diff = f.read()
          payload = {
              'diff': diff,
              'mcp_endpoint_url': (os.environ.get('MCP_URL') or os.environ['BIGAS_URL']).rstrip('/'),
              'pr_url': os.environ.get('PR_URL') or '',
          }
          token = (os.environ.get('MCP_TOKEN') or '').strip()
          if token:
              payload['mcp_auth_token'] = token
          with open('payload.json', 'w') as f:
              json.dump(payload, f)
          "
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o response_body.txt -X POST "$BIGAS_URL/mcp/tools/run_qa" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $BIGAS_API_KEY" \
            -d @payload.json)
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

      - name: Check Bigas response
        run: |
          HTTP_CODE="${{ steps.bigas.outputs.http_code }}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Bigas QA returned HTTP $HTTP_CODE"
            cat response_body.txt || true
            exit 1
          fi
          echo "Bigas QA returned 200 OK."
          cat response_body.txt || true
