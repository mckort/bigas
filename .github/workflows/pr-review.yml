# Run Bigas AI PR review and post/update a single comment on the PR.
# Optionally launch Cursor autofix when BIGAS_AUTO_FIX=true, wait for completion,
# re-review, and Discord "ready to merge" when clean.
# In any repo, configure:
#   Settings → Secrets and variables → Actions
#   - Variable: BIGAS_URL = your Bigas Cloud Run URL (required)
#   - Secret:   BIGAS_API_KEY = one of your Bigas access keys (BIGAS_ACCESS_KEYS)
#   - Variable: BIGAS_AUTO_FIX = true  (optional; enables Cursor autofix after review)
#   - Secret:   GH_PAT_FOR_BIGAS = GitHub PAT with repo scope (optional if GITHUB_TOKEN is in Bigas Secret Manager)
# Discord: Bigas posts to CTO channel using DISCORD_WEBHOOK_URL_CTO from GCP Secret Manager (no GitHub secret needed).
name: Bigas PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Gate runs without concurrency so an autofix push does not cancel the
  # in-flight review/autofix job that owns re-review + merge.
  gate:
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.gate.outputs.continue }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Decide whether to run review
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.state }}" = "closed" ] || [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "continue=false" >> "$GITHUB_OUTPUT"
            echo "Skip: PR is closed/merged."
            exit 0
          fi
          msg="$(git log -1 --pretty=%B)"
          if printf '%s' "$msg" | grep -Fq '[bigas-autofix]'; then
            echo "continue=false" >> "$GITHUB_OUTPUT"
            echo "Skip: head commit is [bigas-autofix]; autofix_followup owns re-review."
            exit 0
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Only cancel overlapping non-autofix runs (user pushes). Autofix pushes
    # never reach this job (gate skips), so their synchronize cannot cancel us.
    concurrency:
      group: bigas-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require BIGAS_URL
        run: |
          if [ -z "$BIGAS_URL" ]; then
            echo "::error::BIGAS_URL is not set. Add it in Settings → Secrets and variables → Actions → Variables (repository variable)."
            exit 1
          fi
        env:
          BIGAS_URL: ${{ vars.BIGAS_URL }}

      - name: Get PR diff via GitHub API
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_BIGAS || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Prefer the GitHub API diff for this PR number. Local `git diff base...HEAD`
          # can be empty if the PR was merged into the base branch before this job ran.
          # Use HTTP status (portable across curl versions) and always keep the body in
          # diff.txt so API error JSON can be printed on failure.
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o diff.txt \
            -H "Accept: application/vnd.github.diff" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to fetch PR diff from GitHub API (HTTP $HTTP_CODE)"
            cat diff.txt || true
            exit 1
          fi
          if [ ! -s diff.txt ]; then
            echo "::warning::GitHub API returned an empty PR diff; Bigas may still fetch it server-side."
          fi
          echo "Fetched PR diff bytes=$(wc -c < diff.txt | tr -d ' ')"

      - name: Trigger Bigas review + comment
        id: bigas
        env:
          BIGAS_URL: ${{ vars.BIGAS_URL }}
          BIGAS_API_KEY: ${{ secrets.BIGAS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT_FOR_BIGAS }}
        run: |
          python3 -c "
          import json, os
          with open('diff.txt', encoding='utf-8', errors='replace') as f:
              diff = f.read()
          payload = {
              'repo': os.environ['GITHUB_REPOSITORY'],
              'pr_number': ${{ github.event.pull_request.number }},
              'diff': diff,
              'github_token': os.environ.get('GH_PAT', '')
          }
          with open('payload.json', 'w') as f:
              json.dump(payload, f)
          "
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o response_body.txt -X POST "$BIGAS_URL/mcp/tools/review_and_comment_pr" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $BIGAS_API_KEY" \
            -d @payload.json)
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

      - name: Check Bigas response
        run: |
          HTTP_CODE="${{ steps.bigas.outputs.http_code }}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Bigas returned HTTP $HTTP_CODE"
            echo "Response body:"
            cat response_body.txt || true
            exit 1
          fi
          echo "Bigas returned 200 OK."
          cat response_body.txt || true

      - name: Autofix loop (up to 5 rounds) + re-review
        if: ${{ vars.BIGAS_AUTO_FIX == 'true' }}
        env:
          BIGAS_URL: ${{ vars.BIGAS_URL }}
          BIGAS_API_KEY: ${{ secrets.BIGAS_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_AUTOFIX_ROUNDS: "5"
          MAX_COOLDOWN_WAITS: "20"
        run: |
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.request

          base = os.environ["BIGAS_URL"].rstrip("/")
          api_key = os.environ["BIGAS_API_KEY"]
          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          max_rounds = int(os.environ.get("MAX_AUTOFIX_ROUNDS") or "5")
          max_cooldown_waits = int(os.environ.get("MAX_COOLDOWN_WAITS") or "20")

          def call(path, body_obj, timeout=180):
              data = json.dumps(body_obj).encode()
              req = urllib.request.Request(
                  f"{base}/mcp/tools/{path}",
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {api_key}",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, json.loads(resp.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      parsed = json.loads(raw) if raw else {}
                  except Exception:
                      parsed = {"error": raw[:500]}
                  return e.code, parsed
              except urllib.error.URLError as e:
                  # urlopen wraps socket timeouts in URLError; check e.reason.
                  import socket
                  if isinstance(e.reason, (TimeoutError, socket.timeout)):
                      # Do not auto-retry launches: the server may still be working and
                      # a second POST could start a duplicate Cursor agent.
                      raise TimeoutError(
                          f"{path} timed out after {timeout}s: {e}"
                      ) from e
                  raise

          def wait_and_finalize(agent_id, run_id, *, baseline_head_sha=None, autofix_round=None):
              payload = {
                  "repo": repo,
                  "pr_number": pr_number,
                  "agent_id": agent_id,
                  "finalize": False,
              }
              if run_id:
                  payload["run_id"] = run_id
              if baseline_head_sha:
                  payload["baseline_head_sha"] = baseline_head_sha
              if autofix_round is not None:
                  payload["autofix_round"] = autofix_round
              attempts = 60
              sleep_s = 30
              last = None
              for i in range(1, attempts + 1):
                  code, last = call("autofix_followup", payload)
                  print(
                      f"poll {i}/{attempts}: HTTP {code} done={last.get('done')} "
                      f"status={last.get('status')}"
                  )
                  if code >= 500:
                      time.sleep(sleep_s)
                      continue
                  if code != 200:
                      raise SystemExit(
                          f"autofix_followup poll failed: HTTP {code} {last}"
                      )
                  if last.get("done"):
                      break
                  time.sleep(sleep_s)
              else:
                  raise SystemExit("Timed out waiting for Cursor autofix to finish")

              finalize_payload = dict(payload)
              finalize_payload["finalize"] = True
              code, final = call("autofix_followup", finalize_payload, timeout=300)
              print(f"finalize: HTTP {code} {json.dumps(final)[:1500]}")
              if code != 200:
                  raise SystemExit(f"autofix_followup finalize failed: HTTP {code}")
              return final

          def cooldown_wait_seconds(data):
              try:
                  raw_cooldown = data.get("cooldown_seconds")
                  cooldown_s = int(raw_cooldown if raw_cooldown is not None else 120)
                  age_s = int(data.get("head_age_seconds") or 0)
                  # Short slices until the window expires; avoid stopping after a few waits.
                  remaining = max(0, cooldown_s - age_s + 15)
                  return max(15, min(remaining, 120))
              except (TypeError, ValueError):
                  return 60

          round_i = 0
          cooldown_waits = 0
          while round_i < max_rounds:
              round_i += 1
              print(f"=== autofix round attempt {round_i}/{max_rounds} ===")
              # Launch can be slow (GitHub fetch + Cursor API). 120s was too short
              # in practice and failed the Actions job after a successful review.
              code, data = call(
                  "autofix_pr",
                  {"repo": repo, "pr_number": pr_number, "is_retry": cooldown_waits > 0},
                  timeout=300,
              )
              print(f"autofix_pr HTTP {code}: {json.dumps(data)[:800]}")
              if code != 200:
                  raise SystemExit(f"autofix_pr failed: HTTP {code} {data}")

              if data.get("loop_protection"):
                  print("Loop protection reached; stopping.")
                  break

              if data.get("cooldown"):
                  if cooldown_waits >= max_cooldown_waits:
                      print(
                          "Exceeded cooldown wait budget in this run; stopping. "
                          "Re-run the workflow after the cooldown window."
                      )
                      break
                  wait_s = cooldown_wait_seconds(data)
                  cooldown_waits += 1
                  print(
                      f"Autofix cooldown ({cooldown_waits}/{max_cooldown_waits}): "
                      f"sleeping {wait_s}s then retrying same round "
                      f"(reason={data.get('reason') or 'cooldown'})."
                  )
                  # Do not consume an autofix round for a cooldown skip.
                  round_i -= 1
                  time.sleep(wait_s)
                  continue

              if data.get("skipped") or not data.get("launched"):
                  print(
                      "Autofix not launched "
                      f"(reason={data.get('reason') or 'skipped'}). Stopping loop."
                  )
                  break

              agent_id = (data.get("agent_id") or "").strip()
              if not agent_id:
                  raise SystemExit("autofix launched but agent_id missing")

              final = wait_and_finalize(
                  agent_id,
                  (data.get("run_id") or "").strip(),
                  baseline_head_sha=(data.get("head_sha") or "").strip() or None,
                  autofix_round=data.get("autofix_round"),
              )
              open("autofix_followup_response.txt", "w").write(
                  json.dumps(final, indent=2)
              )

              if final.get("ready_to_merge"):
                  print("Ready to merge after re-review; done.")
                  break
              if final.get("loop_protection"):
                  print("Loop protection after re-review; done.")
                  break
              if not final.get("fixes_pushed", True):
                  print("No fixes pushed this round; stopping loop.")
                  break
              # Otherwise continue — Bigas updated the review comment; next autofix_pr
              # will use it if under the commit-count limit.
          else:
              print(f"Completed {max_rounds} autofix attempts in this workflow run.")
          PY
